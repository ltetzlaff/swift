version: 2
updates:
  # Keeps the SHA-pinned actions in action.yaml and .github/workflows current.
  # Runs alongside the Thursday Swift release check.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "07:00"
    labels: [patch]
    groups:
      actions:
        patterns: ["*"]
    # Let a fresh release sit for a week before adopting it, so a compromised
    # upstream tag has time to be noticed and yanked.
    cooldown:
      default-days: 7
