name: Release

# Runs on the push a merged PR lands as, not on the PR event: a `pull_request`
# run for a fork PR only ever gets a read-only token, and this keeps everything
# that holds `contents: write` in the trusted context of main.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, its tag, and move the floating major tag
      pull-requests: read # read the merged PR's version label
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the merged PR and its version label
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          PR=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq 'map(select(.merged_at != null and .base.ref == "main")) | first | .number // empty')
          if [[ -z "$PR" ]]; then
            echo "::notice::${SHA} did not come from a merged PR; nothing to release."
            exit 0
          fi
          LABELS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '[.labels[].name] | join(",")')
          BUMP="patch"
          for label in major minor patch; do
            if [[ ",${LABELS,,}," == *",${label},"* ]]; then
              BUMP=$label
              break
            fi
          done
          echo "PR #${PR} → ${BUMP}"
          echo "type=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Compute version and changelog
        id: version
        if: steps.bump.outputs.type != ''
        env:
          BUMP: ${{ steps.bump.outputs.type }}
        run: |
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          LATEST="${LATEST:-v0.0.0}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"

          if [[ "$LATEST" == "v0.0.0" ]]; then
            git log --pretty=format:"- %s (%h)" --no-merges > "$RUNNER_TEMP/notes.md"
          else
            git log "${LATEST}..HEAD" --pretty=format:"- %s (%h)" --no-merges > "$RUNNER_TEMP/notes.md"
          fi

          {
            echo "new_tag=$NEW_TAG"
            echo "major_tag=v${MAJOR}"
          } >> "$GITHUB_OUTPUT"

      # Commit subjects are attacker-controlled text from any merged PR, so the
      # notes travel as a file and are never interpolated into a script.
      - name: Create GitHub release and tag
        if: steps.bump.outputs.type != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "$NEW_TAG" --target "$SHA" --title "$NEW_TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Update major version tag
        # Keeps the floating tag (e.g. v1) pointing to latest — required because
        # consumers of this Action reference it as ltetzlaff/swift@v1
        if: steps.bump.outputs.type != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MAJOR_TAG: ${{ steps.version.outputs.major_tag }}
          SHA: ${{ github.sha }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${MAJOR_TAG}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${MAJOR_TAG}" -f sha="$SHA" -F force=true
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${MAJOR_TAG}" -f sha="$SHA"
          fi
