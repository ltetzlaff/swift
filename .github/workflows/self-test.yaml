name: Self test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck scripts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck scripts/*.sh tests/*.sh

      - name: Signature verification tests
        run: bash tests/verify-signature.test.sh

      - name: Recovery decision tests
        run: bash tests/build-with-recovery.test.sh

      - name: Discarding root outputs keeps dependency outputs
        run: |
          python3 - <<'PY'
          import json, os, subprocess, tempfile
          d = tempfile.mkdtemp()
          conf = os.path.join(d, ".build", "x86_64-unknown-linux-gnu", "release")
          os.makedirs(os.path.join(conf, "Modules"))
          os.symlink(conf, os.path.join(d, ".build", "release"))
          files = ["App.build/main.swift.o", "App-tool.build/x.o", "App", "App.product/x",
                   "Modules/App.swiftmodule", "Modules/My_Lib.swiftmodule", "My-Lib.build/a.o",
                   "HelloPackageTests.product/x",
                   "Dep.build/a.o", "Modules/Dep.swiftmodule", "Application.build/a.o", "description.json"]
          for f in files:
              p = os.path.join(conf, f)
              os.makedirs(os.path.dirname(p), exist_ok=True)
              open(p, "w").close()
          manifest = os.path.join(d, "m.json")
          json.dump({"name": "Hello", "targets": [{"name": "App"}, {"name": "My-Lib"}],
                     "products": [{"name": "App"}]}, open(manifest, "w"))
          script = os.path.join(os.getcwd(), "scripts", "discard-root-outputs.py")
          subprocess.run(["python3", script, "--manifest", manifest,
                          "--build-dir", os.path.join(d, ".build")], check=True)
          left = sorted(os.path.relpath(os.path.join(r, n), conf)
                        for r, _, ns in os.walk(conf) for n in ns)
          want = ["Application.build/a.o", "Dep.build/a.o", "Modules/Dep.swiftmodule", "description.json"]
          assert left == want, left
          print("kept:", left)
          PY

      - name: Mtime stamps land in the past
        run: |
          python3 - <<'PY'
          import subprocess, os, tempfile, time
          # normalize-mtimes.py only walks known package dirs, so build one.
          d = tempfile.mkdtemp()
          os.makedirs(os.path.join(d, "Sources", "Foo"))
          for i in range(5):
              with open(os.path.join(d, "Sources", "Foo", f"f{i}.swift"), "w") as f:
                  f.write(f"let x{i} = {i}\n")
          open(os.path.join(d, "Package.swift"), "w").write("// swift-tools-version:6.0\n")
          script = os.path.join(os.getcwd(), "scripts", "normalize-mtimes.py")
          subprocess.run(["python3", script], cwd=d, check=True)
          now = time.time()
          for root, _, files in os.walk(os.path.join(d, "Sources")):
              for name in files:
                  p = os.path.join(root, name)
                  assert os.path.getmtime(p) < now, f"{p} is not stamped in the past"
          print("all stamps in the past")
          PY

  # Runs the action itself end to end on a throwaway package, on both runner
  # architectures. This is what proves a new default swift-version actually
  # downloads, verifies, installs and builds before it ships.
  action:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/
        id: swift
        with:
          path: tests/fixture
          cache-key-prefix: self-test

      - name: Run built binary
        env:
          BIN_PATH: ${{ steps.swift.outputs.bin-path }}
        run: |
          swift --version
          "$BIN_PATH/Hello" | grep -qx 'hello from swift'

      # The same .build again with fresh-root-package: the root target must
      # compile again even though nothing changed, and still run.
      - name: Rebuild with fresh-root-package
        working-directory: tests/fixture
        env:
          ACTION_PATH: ${{ github.workspace }}
        run: |
          python3 "$ACTION_PATH/scripts/discard-root-outputs.py"
          swift build -c release 2>&1 | tee build.log
          grep -q 'Compiling Hello' build.log
          "$(swift build -c release --show-bin-path)/Hello" | grep -qx 'hello from swift'

  # x.0 releases were published as "6.3" up to 6.3 and as "6.4.0" from 6.4 on;
  # the other spelling must install the same toolchain, not 404.
  version-spelling:
    strategy:
      fail-fast: false
      matrix:
        include:
          - input: "6.3.0"
            expect: "Swift version 6.3 "
          - input: "6.4"
            expect: "Swift version 6.4 "
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/
        with:
          swift-version: ${{ matrix.input }}
          path: tests/fixture
          cache-key-prefix: self-test-spelling
          build: "false"

      - name: Installed the expected toolchain
        env:
          EXPECT: ${{ matrix.expect }}
        run: swift --version 2>&1 | tee /dev/stderr | grep -qF "$EXPECT"

  # locked-dependencies: builds when Package.resolved matches, refuses to run
  # when there is no Package.resolved to lock to.
  locked:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/
        id: swift
        with:
          path: tests/fixture-locked
          cache-key-prefix: self-test-locked
          locked-dependencies: "true"

      - name: Run built binary
        env:
          BIN_PATH: ${{ steps.swift.outputs.bin-path }}
        run: |
          "$BIN_PATH/Locked" | grep -qx 'hello from a locked package'
          git diff --exit-code -- tests/fixture-locked/Package.resolved

      - uses: $/
        id: missing
        continue-on-error: true
        with:
          path: tests/fixture
          cache-key-prefix: self-test-locked-missing
          locked-dependencies: "true"

      - name: Missing Package.resolved must fail
        env:
          OUTCOME: ${{ steps.missing.outcome }}
        run: |
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "::error::locked-dependencies accepted a package without Package.resolved"
            exit 1
          fi

  # Static security audit of action.yaml, the workflows and dependabot.yml:
  # template injection, credential persistence, unpinned actions, excessive
  # permissions. Any finding fails the PR.
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
