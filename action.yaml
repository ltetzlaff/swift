name: Build Swift Package
description: >
  Set up Swift toolchain, restore build cache with proper mtime normalization,
  and build a Swift package with true incremental compilation.
branding:
  icon: box
  color: orange

inputs:
  swift-version:
    description: >
      Swift toolchain version, e.g. "6.3.3". Pin an exact patch: "6.3" and
      "6.3.0" both mean 6.3.0, never the latest 6.3.x. Either spelling of an
      x.0 release works. 6.4.0 cannot statically link Foundation on Linux; it
      is not the default.
    default: "6.3.3"
  path:
    description: Path to the Swift package (contains Package.swift)
    default: "."
  ssh-key:
    description: SSH private key for private GitHub dependency repos
    required: false
    default: ""
  configuration:
    description: "Build configuration: debug or release"
    default: "release"
  product:
    description: Specific product to build (builds all by default)
    required: false
    default: ""
  static-swift-stdlib:
    description: Statically link the Swift standard library
    default: "true"
  extra-swift-flags:
    description: Additional flags passed to swift build
    required: false
    default: ""
  cache-key-prefix:
    description: Cache key prefix for the .build directory
    default: "swiftpm"
  cache-suffix:
    description: >
      Opaque string folded into the .build cache key. Change it to abandon every
      existing cache for this prefix and build cold — an escape hatch for when a
      cache is suspected bad and you would otherwise delete it through the API.
    required: false
    default: ""
  jemalloc:
    description: Install and link jemalloc
    default: "false"
  build:
    description: "Run swift build. Set to 'false' for setup-only (e.g. when running tests)."
    default: "true"
  locked-dependencies:
    description: >
      Resolve strictly from the committed Package.resolved and fail if it is
      missing or out of date, instead of silently resolving other versions.
      Recommended for applications and services that commit Package.resolved.
    default: "false"

outputs:
  cache-hit:
    description: Whether the .build cache was an exact match
    value: ${{ steps.build-cache.outputs.cache-hit }}
  cache-recovered:
    description: >
      Whether a restored .build turned out to be stale and was discarded for a
      cold rebuild. 'true' means the build is green but took the slow path.
    value: ${{ steps.build.outputs.recovered }}
  bin-path:
    description: Absolute path to the build output directory
    value: ${{ steps.build-info.outputs.bin-path }}

runs:
  using: composite
  steps:
    # ── Setup ──────────────────────────────────────────────────
    - name: Configure SSH
      if: inputs.ssh-key != ''
      uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
      with:
        ssh-private-key: ${{ inputs.ssh-key }}

    - name: Cache Swift toolchain
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/swift-Ubuntu
        # "verified" marks toolchains installed under pinned-key verification;
        # ones cached while a failed signature was only a warning are never reused.
        key: swift-toolchain-verified-${{ inputs.swift-version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install Swift
      id: install
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
        TOOL_CACHE: ${{ runner.tool_cache }}
        ACTION_PATH: ${{ github.action_path }}
      # GITHUB_PATH gets only TOOL_CACHE/swift-Ubuntu/<validated version>/usr/bin.
      run: | # zizmor: ignore[github-env]
        # The version lands in URLs and paths; refuse anything but a release number.
        if [[ ! "$SWIFT_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
          echo "::error::swift-version must look like 6.4.0, got '${SWIFT_VERSION}'"
          exit 1
        fi
        # swift.org published x.0 releases as "6.3" up to 6.3 and as "6.4.0" from
        # 6.4 on. Accept either spelling and download the name that exists.
        IFS=. read -r V_MAJOR V_MINOR V_PATCH <<< "$SWIFT_VERSION"
        if (( V_MAJOR > 6 || (V_MAJOR == 6 && V_MINOR >= 4) )); then
          DL_VERSION="${V_MAJOR}.${V_MINOR}.${V_PATCH:-0}"
        elif [[ "${V_PATCH:-0}" == 0 ]]; then
          DL_VERSION="${V_MAJOR}.${V_MINOR}"
        else
          DL_VERSION="$SWIFT_VERSION"
        fi
        SWIFT_BRANCH="swift-${DL_VERSION}-release"
        SWIFT_TAG="swift-${DL_VERSION}-RELEASE"
        UBUNTU_VERSION=$(. /etc/os-release && echo "${VERSION_ID}")
        echo "ubuntu-version=${UBUNTU_VERSION}" >> "$GITHUB_OUTPUT"
        UBUNTU_LABEL="ubuntu${UBUNTU_VERSION}"
        PLATFORM="ubuntu${UBUNTU_VERSION//./}"

        ARCH=$(uname -m)
        if [[ "$ARCH" == "aarch64" ]]; then
          PLATFORM="${PLATFORM}-aarch64"
          UBUNTU_LABEL="${UBUNTU_LABEL}-aarch64"
        fi

        TOOLCHAIN_DIR="${TOOL_CACHE}/swift-Ubuntu/${SWIFT_VERSION}"
        if [[ -x "${TOOLCHAIN_DIR}/usr/bin/swift" ]]; then
          echo "Swift ${SWIFT_VERSION} already cached"
        else
          BASE_URL="https://download.swift.org/${SWIFT_BRANCH}/${PLATFORM}/${SWIFT_TAG}"
          TARBALL="${SWIFT_TAG}-${UBUNTU_LABEL}.tar.gz"
          echo "Downloading ${BASE_URL}/${TARBALL}"

          # Signing keys are vendored in keys/ and pinned by fingerprint here,
          # never fetched from swift.org next to the tarball they vouch for.
          MAJOR_VERSION="${SWIFT_VERSION%%.*}"
          case "$MAJOR_VERSION" in
            6) KEY_FPR=52BB7E3DE28A71BE22EC05FFEF80A866B47A981F ;;
            5) KEY_FPR=A62AE125BBBFBB96A6E042EC925CC1CCED3D1561 ;;
            *)
              echo "::error::No pinned signing key for Swift ${MAJOR_VERSION}.x; see keys/README.md"
              exit 1
              ;;
          esac

          DL_DIR="$(mktemp -d)"
          CURL=(curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2)
          "${CURL[@]}" "${BASE_URL}/${TARBALL}" -o "${DL_DIR}/${TARBALL}"
          "${CURL[@]}" "${BASE_URL}/${TARBALL}.sig" -o "${DL_DIR}/${TARBALL}.sig"

          # A toolchain that fails its signature check is never installed: it
          # would be cached and linked into every binary this action builds.
          if ! bash "${ACTION_PATH}/scripts/verify-signature.sh" \
              "${DL_DIR}/${TARBALL}" "${DL_DIR}/${TARBALL}.sig" \
              "${ACTION_PATH}/keys/swift-${MAJOR_VERSION}.x.asc" "$KEY_FPR"; then
            echo "::error::Signature verification failed for ${TARBALL}"
            exit 1
          fi

          mkdir -p "${TOOLCHAIN_DIR}"
          tar xzf "${DL_DIR}/${TARBALL}" --strip-components=1 -C "${TOOLCHAIN_DIR}"
          rm -rf "${DL_DIR}"
        fi

        # Putting swift on PATH is the point of this step; the entry is built from
        # the validated version and the runner's own tool cache.
        echo "${TOOLCHAIN_DIR}/usr/bin" >> "$GITHUB_PATH"
        swift --version

    - name: Restore SwiftPM .build cache
      id: build-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}/.build
        key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ steps.install.outputs.ubuntu-version }}-${{ runner.arch }}-${{ inputs.cache-suffix != '' && format('{0}-', inputs.cache-suffix) || '' }}${{ hashFiles(format('{0}/Package.resolved', inputs.path)) }}-${{ github.sha }}
        # Only ever fall back within one Package.resolved. A .build from a
        # different dependency graph links stale objects against freshly
        # compiled dependencies — a changed graph must build cold.
        #
        # Within one graph the fallback still hands over a .build whose
        # first-party objects predate this checkout. That is deliberate — it is
        # what makes ordinary commits incremental — and the residual risk of a
        # stale link is handled after the fact by scripts/build-with-recovery.sh
        # rather than by narrowing this key, since first-party sources change on
        # nearly every commit and keying on them would mean never reusing a cache.
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ steps.install.outputs.ubuntu-version }}-${{ runner.arch }}-${{ inputs.cache-suffix != '' && format('{0}-', inputs.cache-suffix) || '' }}${{ hashFiles(format('{0}/Package.resolved', inputs.path)) }}-

    - name: Install system build dependencies
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

    - name: Install jemalloc
      if: inputs.jemalloc == 'true'
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends libjemalloc-dev

    # ── Resolve & Normalize ────────────────────────────────────
    - name: Resolve dependencies
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        LOCKED: ${{ inputs.locked-dependencies }}
      run: |
        if [[ "$LOCKED" == "true" ]]; then
          # Without the file there is nothing to lock to, and SwiftPM would
          # quietly resolve fresh versions anyway.
          if [[ ! -f Package.resolved ]]; then
            echo "::error::locked-dependencies is on but Package.resolved is missing"
            exit 1
          fi
          swift package resolve --only-use-versions-from-resolved-file
        else
          swift package resolve
        fi

    - name: Normalize file timestamps for incremental builds
      shell: bash
      working-directory: ${{ inputs.path }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/normalize-mtimes.py"

    # ── Build ──────────────────────────────────────────────────
    - name: Build
      if: inputs.build == 'true'
      id: build
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        CONFIGURATION: ${{ inputs.configuration }}
        PRODUCT: ${{ inputs.product }}
        STATIC_STDLIB: ${{ inputs.static-swift-stdlib }}
        JEMALLOC: ${{ inputs.jemalloc }}
        EXTRA_FLAGS: ${{ inputs.extra-swift-flags }}
        # Empty when this run built cold — the script only blames a cache it got.
        CACHE_MATCHED_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/build-with-recovery.sh"

    - name: Determine build output path
      if: inputs.build == 'true'
      id: build-info
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        CONFIGURATION: ${{ inputs.configuration }}
      run: echo "bin-path=$(swift build -c "$CONFIGURATION" --show-bin-path)" >> "$GITHUB_OUTPUT"

    - name: Save SwiftPM .build cache
      if: inputs.build == 'true' && steps.build-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}/.build
        key: ${{ steps.build-cache.outputs.cache-primary-key }}
